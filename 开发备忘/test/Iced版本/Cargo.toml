[package]
name = "TXT-Editor"
version = "0.1.0"
edition = "2024"

[dependencies]
# ---- UI 框架 ----
iced = "0.14"
iced-code-editor = "0.5"

# ---- 文本/编码/IO ----
ropey = "1.6"
encoding_rs = "0.8"
chardetng = "0.1"

# ---- 文件对话框 ----
rfd = "0.15"

# ---- 序列化（未来 persistence 用）----
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# ---- 平台相关 ----
[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_UI_WindowsAndMessaging",
] }