[package]
name = "TXT-Editor"
version = "0.1.0"
edition = "2021"

[dependencies]
slint = "1.18.0"
ropey = "1.6.1"
rfd = "0.15"
encoding_rs = "0.8"
chardetng = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "5"
uuid = { version = "1", features = ["v4"] }
aes-gcm = "0.10"
keyring = "2"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi"
] }

[build-dependencies]
slint-build = "1.18.0"
winresource = "0.1"

